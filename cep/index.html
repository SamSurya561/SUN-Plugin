<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SUN Plugin</title>
  <link rel="stylesheet" href="sun-app.css">
  <style>
    /* Prevent flash of unstyled content while React hydrates */
    body { margin: 0; padding: 0; background: #0a0a0b; color: #e4e4e7; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    #root { width: 100%; height: 100vh; display: flex; align-items: center; justify-content: center; }
    #root:empty::after { content: 'Loading SUN Plugin...'; opacity: 0.4; font-size: 13px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <!-- Script order matters: CSInterface + host-bridge must set window.sunHost BEFORE React loads -->
  <script src="CSInterface.js"></script>
  <script src="host-bridge.js"></script>
  <script src="sun-app.js"></script>
</body>
</html>
